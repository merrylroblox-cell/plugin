name: HealNote V2
main: com.healnote.HealNotePlugin
version: 2.0.0
api-version: 1.20
description: Death Note inspired plugin with permanent ban system
authors:
  - merrylroblox-cell

commands:
  healnote:
    description: HealNote V2 commands
    usage: /healnote <command>
    aliases:
      - hn

permissions:
  healnote.*:
    description: All HealNote commands
    default: false
  healnote.admin:
    description: Admin commands for HealNote
    default: op
